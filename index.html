<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Form Laporan Kegiatan Harian</title>
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbwAgzefSjoYnIHcbYdBYZabW8CvTEiyOOnswVmqV2UDhmhlqzrqIX2AdWa1tD_LE_KW/exec">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(15, 23, 42, .08);
    }
    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #eaf2ff;
      color: #1a73e8;
      font-size: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #111827;
    }
    p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 22px auto 0;
      border: 3px solid #dbeafe;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      color: #1a73e8;
      text-decoration: none;
      font-weight: 700;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="logo">✓</div>
      <h1>Form Laporan Kegiatan Harian</h1>
      <p>Membuka aplikasi, mohon tunggu...</p>
      <div class="spinner" aria-label="Memuat"></div>
      <a href="https://script.google.com/macros/s/AKfycbwAgzefSjoYnIHcbYdBYZabW8CvTEiyOOnswVmqV2UDhmhlqzrqIX2AdWa1tD_LE_KW/exec">Buka Form</a>
    </section>
  </main>

  <script>
    // Redirect langsung tanpa iframe.
    window.location.replace("https://script.google.com/macros/s/AKfycbwAgzefSjoYnIHcbYdBYZabW8CvTEiyOOnswVmqV2UDhmhlqzrqIX2AdWa1tD_LE_KW/exec");
  </script>
</body>
</html>
