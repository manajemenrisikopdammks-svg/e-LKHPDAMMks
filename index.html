<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Kegiatan Harian - PERUMDA Air Minum Kota Makassar</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F4F6F9;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #E5E9F0;
            border-top: 5px solid #165DFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #080C1A;
            font-size: 18px;
            margin-bottom: 8px;
        }
        p {
            color: #6A7686;
            font-size: 14px;
        }
        a {
            color: #165DFF;
            font-weight: bold;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Mengalihkan secara otomatis ke URL Web App Google Apps Script Aktif
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyM37CtqIfptCSg0ypw5QgYLpElsopjgk6v0rA4spzZvNtkeOnQ0xDDevEEaLm5gnEl/exec";
        
        window.onload = function() {
            window.location.href = WEB_APP_URL;
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Mengalihkan ke Sistem Laporan Kegiatan Harian PERUMDA...</h2>
        <p>Jika halaman tidak berpindah secara otomatis, <a href="https://script.google.com/macros/s/AKfycbyM37CtqIfptCSg0ypw5QgYLpElsopjgk6v0rA4spzZvNtkeOnQ0xDDevEEaLm5gnEl/exec">klik di sini untuk membuka aplikasi</a>.</p>
    </div>
</body>
</html>
